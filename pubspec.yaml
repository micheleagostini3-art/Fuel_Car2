name: fuel_car
description: App per tracciare rifornimenti e service dell'auto. Visualizzazione e gestione dati offline tramite file CSV locale.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  cupertino_icons: ^1.0.2
  path_provider: ^2.1.1
  intl: ^0.19.0
  csv: ^6.0.0
  share_plus: ^7.1.0
  permission_handler: ^11.4.4
  fl_chart: ^0.63.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
